name: Quality

# Runs the quality gate (Biome + TypeScript + build) on pushes and PRs.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run check
      - run: npm run typecheck
      - run: npm run build
